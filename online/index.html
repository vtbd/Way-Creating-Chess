<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Way Creating Chess · 联机对战</title>
    <meta
      name="description"
      content="Way Creating Chess 网页联机版：房主创建房间并决定先后手与初始棋盘，邀请链接一键加入，支持请求撤销与再来一局。"
    />
    <link rel="icon" type="image/svg+xml" href="../assets/icon.svg" />
    <link rel="stylesheet" href="../css/styles.css" />
    <link rel="stylesheet" href="online.css" />
  </head>
  <body>
    <div class="app">
      <header class="topbar">
        <div class="brand">
          <img class="brand-icon" src="../assets/icon.svg" alt="" width="44" height="44" />
          <div class="brand-text">
            <h1>联机对战</h1>
            <p>Way Creating Chess · 房间号对战</p>
          </div>
        </div>
        <div class="topbar-actions">
          <a class="ghost-button link-button" href="../index.html">返回单机版</a>
          <a class="ghost-button link-button" href="README.md">联机说明</a>
        </div>
      </header>

      <main class="layout">
        <section class="board-panel">
          <div id="result-banner" class="banner hidden">
            <strong id="result-text"></strong>
            <div id="result-host" class="row-gap hidden">
              <button id="rematch" type="button" class="primary">再来一局</button>
              <button id="rematch-swap" type="button">再来一局（交换先后手）</button>
            </div>
            <p id="result-guest" class="hint">等待房主开始新一局…</p>
          </div>
          <div class="board-frame">
            <div id="board" class="board" aria-label="棋盘"></div>
          </div>
          <p id="notice" class="notice" aria-live="polite"></p>
        </section>

        <aside id="sidebar" class="sidebar"></aside>
      </main>

      <footer class="page-footer">
        <p>
          联机版与单机版共用同一份规则引擎（<code>js/engine.js</code>）：后端只保存棋盘定义与着法列表，
          两边各自重放得到棋局，刷新与断线重连只需重新拉一次数据。
        </p>
      </footer>
    </div>

    <div id="boot-warning" class="boot-warning hidden">
      <h2>需要通过本地服务器或 GitHub Pages 打开</h2>
      <p>这个页面使用 ES 模块，直接双击 <code>online/index.html</code>（<code>file://</code>）会被浏览器拦截。</p>
      <pre>node tools/serve.mjs</pre>
      <p>然后访问 <code>http://localhost:8000/online/</code>。</p>
    </div>

    <script>
      (function () {
        var warning = document.getElementById('boot-warning');
        if (window.location.protocol === 'file:') warning.classList.remove('hidden');
        window.setTimeout(function () {
          if (!window.__onlineBooted) warning.classList.remove('hidden');
        }, 1500);
      })();
    </script>
    <script type="module" src="online.js"></script>
  </body>
</html>
