<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Way Creating Chess · 造路四子棋（网页版）</title>
    <meta
      name="description"
      content="Way Creating Chess 网页版：自定义初始棋盘、双人/人机对战、内置随机 AI 与 Alpha-Beta 思考型 AI，可直接部署到 GitHub Pages。"
    />
    <link rel="icon" type="image/svg+xml" href="assets/icon.svg" />
    <link rel="apple-touch-icon" href="assets/icon.svg" />
    <link rel="stylesheet" href="css/styles.css" />
  </head>
  <body>
    <div class="app">
      <header class="topbar">
        <div class="brand">
          <img class="brand-icon" src="assets/icon.svg" alt="" width="44" height="44" />
          <div class="brand-text">
            <h1>Way Creating Chess</h1>
            <p>造路四子棋 · 网页版</p>
          </div>
        </div>
        <div class="topbar-actions">
          <button id="btn-open-help" class="ghost-button" type="button">规则说明 (H)</button>
          <a class="ghost-button link-button" href="online/">联机对战</a>
          <button id="btn-open-setup" class="primary-button" type="button">新棋盘 / 自定义 (N)</button>
        </div>
      </header>

      <main class="layout">
        <section class="board-panel">
          <div class="board-frame">
            <div id="board" class="board" aria-label="棋盘"></div>
          </div>
          <p id="board-caption" class="board-caption"></p>
          <p id="notice" class="notice" aria-live="polite"></p>
        </section>

        <aside class="sidebar">
          <section class="card">
            <h2>对局状态</h2>
            <div id="turn-chip" class="turn-chip"></div>
            <p id="status-line" class="status-line"></p>
            <dl class="stats">
              <div><dt>已走</dt><dd id="stat-moves">0</dd></div>
              <div><dt>可走</dt><dd id="stat-open">0</dd></div>
              <div><dt>棋盘</dt><dd id="stat-board">—</dd></div>
            </dl>
            <p id="thinking" class="thinking hidden"></p>
          </section>

          <section class="card">
            <h2>双方身份</h2>
            <div id="sides" class="sides"></div>
            <button id="swap-btn" class="action-button wide" type="button">⇄ 交换双方身份</button>
            <p class="card-hint">快速预设</p>
            <div id="presets" class="presets"></div>
          </section>

          <section class="card">
            <h2>操作</h2>
            <div id="actions" class="actions"></div>
            <p class="card-hint">
              U 撤销 · R 重开 · N 新棋盘 · E 编辑 · T AI 参数 · S 棋谱 · P 存棋盘 · H 规则 · 1/2 切换 A、B 方控制
            </p>
          </section>

          <section class="card">
            <h2>棋谱</h2>
            <ol id="history" class="history"></ol>
            <p class="card-hint">点击任意一步可在棋盘上高亮该手与它造出的道路。</p>
          </section>
        </aside>
      </main>

      <footer class="page-footer">
        <p>
          规则与桌面版 <code>game_engine.py</code> 一致：在“可走”格落子后自动造路，先连成四子者获胜。
          棋盘可随机生成、手动编辑，也能把当前局面存成新的初始棋盘。
        </p>
      </footer>
    </div>

    <div id="modal-root" class="modal-root hidden">
      <div id="modal" class="modal" role="dialog" aria-modal="true"></div>
    </div>

    <div id="boot-warning" class="boot-warning hidden">
      <div class="boot-warning-head">
        <h2 id="boot-warning-title"></h2>
        <button type="button" class="icon-button" title="关闭提示" onclick="document.getElementById('boot-warning').classList.add('hidden')">✕</button>
      </div>
      <p id="boot-warning-detail"></p>
      <p id="boot-warning-steps" class="hint"></p>
    </div>

    <script>
      (function () {
        var warning = document.getElementById('boot-warning');
        var title = document.getElementById('boot-warning-title');
        var detail = document.getElementById('boot-warning-detail');
        var steps = document.getElementById('boot-warning-steps');

        function show(heading, message, hint) {
          title.textContent = heading;
          detail.textContent = message || '';
          steps.textContent = hint || '';
          warning.classList.remove('hidden');
        }

        // The page calls `ready()` once the module has booted, so a slow start
        // never leaves a stale warning on screen.
        window.__wayChessBanner = {
          show: show,
          ready: function () {
            window.__wayChessBooted = true;
            warning.classList.add('hidden');
          },
        };

        if (window.location.protocol === 'file:') {
          show(
            '需要通过本地服务器或 GitHub Pages 打开',
            '这个页面使用了 ES 模块与 Web Worker，直接双击 index.html（file://）会被浏览器拦截。',
            '在项目目录执行 node tools/serve.mjs（或 npx serve .、py -m http.server 8000），再访问提示的地址。',
          );
        }

        // A failed <script>/<link> (404, wrong MIME type, offline) surfaces here
        // with the exact URL, which is far more useful than a generic message.
        window.addEventListener(
          'error',
          function (event) {
            var target = event.target;
            if (target && (target.tagName === 'SCRIPT' || target.tagName === 'LINK')) {
              show(
                '有文件加载失败',
                '加载 ' + (target.src || target.href) + ' 时出错（常见原因：404 或 MIME 类型不对）。',
                '请确认 js/、css/ 目录下的文件都已推送到 GitHub Pages，并在 F12 → Console / Network 里查看具体状态码。',
              );
            } else if (event.message) {
              show('页面脚本出错', event.message, '按 F12 打开控制台查看第一条红色错误的完整堆栈。');
            }
          },
          true,
        );
        window.addEventListener('unhandledrejection', function (event) {
          var reason = event.reason && (event.reason.message || event.reason);
          show('页面脚本出错', String(reason || '未处理的 Promise 异常'), '按 F12 打开控制台查看完整堆栈。');
        });

        window.setTimeout(function () {
          if (!window.__wayChessBooted) {
            show(
              '页面还没有启动完成',
              '模块可能仍在下载（网络较慢），也可能加载失败。',
              '稍等几秒；若一直没有反应，请按 F12 查看 Console / Network 的报错，并确认 js/ 目录下的文件都已上传。',
            );
          }
        }, 6000);
      })();
    </script>
    <script type="module" src="js/app.js"></script>
  </body>
</html>
